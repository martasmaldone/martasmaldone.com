<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body {
            font-family: 'Karla', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            line-height: 1.5;
            color: #000;
            background: #fff;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; height: auto; display: block; }

        /* Header */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: #fff;
            padding: 25px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .main-nav {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .main-nav ul {
            list-style: none;
            display: flex;
            gap: 35px;
        }
        .main-nav a {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .main-nav a:hover,
        .main-nav a.active { opacity: 1; }

        /* Dropdown */
        .has-dropdown { position: relative; }
        .dropdown {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 20px 0;
            min-width: 240px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            text-align: center;
            margin-top: 10px;
        }
        .has-dropdown:hover .dropdown {
            opacity: 1;
            visibility: visible;
        }
        .dropdown li { padding: 0; }
        .dropdown a {
            display: block;
            padding: 10px 25px;
            font-size: 12px;
            text-transform: none;
            letter-spacing: 0.3px;
            opacity: 0.6;
        }
        .dropdown a:hover { opacity: 1; }

        /* Social */
        .social-link {
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .social-link:hover { opacity: 1; }
        .social-link svg { width: 18px; height: 18px; }

        /* Main Content */
        main {
            padding-top: 90px;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        /* Horizontal Slideshow Gallery */
        .gallery {
            display: flex;
            gap: 30px;
            padding: 0 40px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            align-items: center;
            height: calc(100vh - 90px);
        }
        .gallery::-webkit-scrollbar {
            display: none;
        }
        .gallery-item {
            flex-shrink: 0;
        }
        .gallery-item a {
            display: block;
        }
        .gallery-item img {
            height: 70vh;
            width: auto;
            max-width: none;
            transition: opacity 0.3s;
        }
        .gallery-item a:hover img { opacity: 0.85; }

        /* Footer */
        .site-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #999;
            text-transform: uppercase;
            background: linear-gradient(transparent, rgba(255,255,255,0.9));
            pointer-events: none;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .site-header {
                padding: 20px 25px;
                flex-wrap: wrap;
            }
            .main-nav {
                position: static;
                transform: none;
                order: 3;
                width: 100%;
                margin-top: 20px;
            }
            .main-nav ul {
                justify-content: center;
                gap: 25px;
            }
            .dropdown {
                position: static;
                transform: none;
                margin-top: 15px;
                padding: 10px 0;
            }
            main {
                padding-top: 120px;
            }
            .gallery {
                padding: 0 25px;
                gap: 20px;
                height: calc(100vh - 120px);
            }
            .gallery-item img {
                height: 50vh;
            }
        }
    </style>
</head>
